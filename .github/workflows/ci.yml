name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Código só para os testes; o de verdade fica nas variáveis da Vercel.
      CODIGO_ACESSO_EQUIPE: codigo-de-teste-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes de unidade (Vitest)
        run: npm test

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Testes de ponta a ponta (Playwright)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
