<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cardápio (celular) · Cantina da Mídia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2F2F3}
a{color:inherit}
button{cursor:pointer;font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #00716A;outline-offset:2px}
input::placeholder{color:#6B6B74}
.m{--page:#F2F2F3;--bg:#FFFFFF;--sub:#FAFAFA;--hover:#F4F4F5;--line:#ECECEE;--line-2:#E2E2E5;--text:#111113;--text-2:#3F3F46;--muted:#6B6B74;--primary:#111113;--on-primary:#FFFFFF;--accent:#00716A;--accent-fill:#359E95;--accent-soft:#E6F4F2}
.m{position:relative;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;background:var(--page);color:var(--text);font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.m-head{display:flex;flex-direction:column;gap:12px;padding:16px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.m-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.m-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding:6px 6px 14px}
.m-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-decoration:none;color:var(--muted);font-size:10px}
.m-tab .ico{width:44px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.m-tab[aria-current="page"]{color:var(--text);font-weight:600}
.m-tab[aria-current="page"] .ico{background:var(--primary);color:var(--on-primary)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;box-sizing:border-box;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;flex:none}
.m-body>*,.m-head>*{flex-shrink:0}
.sub{font-size:11px;color:var(--muted)}
.field{height:42px;box-sizing:border-box;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);display:flex;align-items:center;padding:0 12px;gap:8px}
.field input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--text);min-width:0;width:100%;height:100%}
</style>
</helmet>
<div class="m">

  <header class="m-head">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; line-height: 1.25">
        <strong style="font-size: 18px; font-weight: 600">Cardápio</strong>
        <span class="sub">Preços de {{diaLongo}}</span>
      </div>
      <button type="button" onClick="{{abrirNovo}}" style="height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 12px; display: inline-flex; align-items: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        Item
      </button>
    </div>
    <div class="chips" role="tablist" aria-label="Dia de venda">
      <sc-for list="{{abas}}" as="a" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{a.on}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
      </sc-for>
    </div>
  </header>

  <div class="m-body">
    <sc-if value="{{novoAberto}}" hint-placeholder-val="{{false}}">
      <form class="card" aria-label="Novo item" style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <strong style="font-weight: 600">Novo item</strong>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label class="sub" for="mn-nome">Nome</label>
          <div class="field"><input id="mn-nome" type="text" placeholder="Ex.: Pão de queijo" value="{{novoNome}}" onChange="{{digitarNome}}"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label class="sub" for="mn-preco">Preço padrão</label>
          <div class="field"><span class="sub">R$</span><input id="mn-preco" type="text" inputmode="decimal" placeholder="0,00" value="{{novoPreco}}" onChange="{{digitarPreco}}"></div>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" onClick="{{salvarNovo}}" style="flex: 1; height: 42px; border-radius: 10px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 13px">Salvar item</button>
          <button type="button" onClick="{{fecharNovo}}" style="height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: var(--text-2); font-size: 13px">Cancelar</button>
        </div>
      </form>
    </sc-if>

    <span class="sub">Mudar um preço vale para as próximas vendas deste dia.</span>

    <sc-for list="{{itens}}" as="i" hint-placeholder-count="2">
      <section class="card" style="{{i.cardStyle}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 38px; height: 38px; flex: none; border-radius: 9px; border: 1px solid var(--line); background: var(--sub); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{i.sigla}}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
            <strong style="font-weight: 600">{{i.nome}}</strong>
            <span class="sub">{{i.vendidos}} · padrão {{i.padrao}}</span>
          </div>
          <button type="button" role="switch" aria-checked="{{i.ativo}}" onClick="{{i.alternar}}" aria-label="{{i.ariaAtivo}}" style="border: 0; background: transparent; padding: 4px">
            <span style="{{i.trilho}}"><span style="{{i.bolinha}}"></span></span>
          </button>
        </div>
        <sc-if value="{{i.ativo}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line)">
            <sc-if value="{{i.lendo}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; flex-direction: column; line-height: 1.25">
                <span class="sub">Preço neste dia</span>
                <strong style="font-size: 18px; font-weight: 600">{{i.preco}}</strong>
              </div>
              <button type="button" onClick="{{i.editar}}" style="height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg); color: var(--text); font-size: 12px; display: inline-flex; align-items: center; gap: 6px">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                Mudar preço
              </button>
            </sc-if>
            <sc-if value="{{i.editando}}" hint-placeholder-val="{{false}}">
              <div class="field" style="flex: 1">
                <span class="sub">R$</span>
                <label for="mp-preco" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Novo preço</label>
                <input id="mp-preco" type="text" inputmode="decimal" value="{{i.rascunho}}" onChange="{{i.digitar}}" style="font-weight: 600">
              </div>
              <button type="button" onClick="{{i.salvar}}" style="height: 42px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 13px">Salvar</button>
            </sc-if>
          </div>
        </sc-if>
      </section>
    </sc-for>
  </div>

  <nav class="m-tabs" aria-label="Menu">
    <a class="m-tab" href="Mobile-Painel.dc.html">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg></span>
      Painel
    </a>
    <a class="m-tab" href="Mobile-Vendas.dc.html">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="17" cy="20" r="1"></circle></svg></span>
      Vendas
    </a>
    <a class="m-tab" href="Mobile-Pendentes.dc.html">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
      Pendentes
    </a>
    <a class="m-tab" href="Mobile-Cardapio.dc.html" aria-current="page">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v20"></path><path d="M4 2v6a3 3 0 0 0 6 0V2"></path><path d="M17 2c-1.7 0-3 2-3 5s1.3 4 3 4v11"></path></svg></span>
      Cardápio
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      dia: '15nov', editando: null, rascunho: '', novoAberto: false, novoNome: '', novoPreco: '',
      produtos: [ { id: 'espeto', nome: 'Espeto de carne', padrao: 12 }, { id: 'refri', nome: 'Refrigerante lata', padrao: 6 } ],
      precos: { '15nov': { espeto: 12, refri: 6 }, '01nov': { espeto: 12, refri: 6 }, '18out': { espeto: 10 } }
    };
  }
  renderVals() {
    const DIAS = { '15nov': ['15 nov · próximo', '15 de novembro'], '01nov': ['01 nov', '1 de novembro'], '18out': ['18 out', '18 de outubro'] };
    const VENDIDOS = { '01nov': { espeto: 6 }, '18out': { espeto: 22 } };
    const num = (t) => { const n = Number(String(t).replace(',', '.').replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? n : 0; };
    const brl = (n) => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
    const s = this.state;
    const pd = s.precos[s.dia] || {};
    const chip = 'height: 32px; padding: 0 14px; border-radius: 99px; font-size: 12px; white-space: nowrap; flex: none; ';
    const setP = (novo) => ({ precos: { ...s.precos, [s.dia]: novo } });
    return {
      diaLongo: DIAS[s.dia][1],
      abas: Object.keys(DIAS).map((id) => ({
        label: DIAS[id][0], on: s.dia === id, pick: () => this.setState({ dia: id, editando: null }),
        style: chip + (s.dia === id ? 'border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary)' : 'border: 1px solid var(--line-2); background: var(--bg); color: var(--text-2)')
      })),
      novoAberto: s.novoAberto,
      abrirNovo: () => this.setState({ novoAberto: true }),
      fecharNovo: () => this.setState({ novoAberto: false, novoNome: '', novoPreco: '' }),
      novoNome: s.novoNome,
      novoPreco: s.novoPreco,
      digitarNome: (e) => this.setState({ novoNome: e.target.value }),
      digitarPreco: (e) => this.setState({ novoPreco: e.target.value }),
      salvarNovo: () => {
        const nome = s.novoNome.trim(), preco = num(s.novoPreco);
        if (!nome || preco <= 0) return;
        const id = 'item' + (s.produtos.length + 1);
        this.setState({ novoAberto: false, novoNome: '', novoPreco: '', produtos: s.produtos.concat([{ id, nome, padrao: preco }]), ...setP({ ...pd, [id]: preco }) });
      },
      itens: s.produtos.map((p) => {
        const ativo = pd[p.id] !== undefined;
        const v = ((VENDIDOS[s.dia] || {})[p.id]) || 0;
        return {
          nome: p.nome,
          sigla: p.nome.split(' ').filter((w) => w.length > 2).map((w) => w[0]).join('').slice(0, 2).toUpperCase(),
          padrao: brl(p.padrao),
          vendidos: v + (v === 1 ? ' vendido' : ' vendidos'),
          preco: brl(ativo ? pd[p.id] : p.padrao),
          ativo,
          lendo: s.editando !== p.id,
          editando: s.editando === p.id,
          rascunho: s.rascunho,
          editar: () => this.setState({ editando: p.id, rascunho: String(pd[p.id]).replace('.', ',') }),
          digitar: (e) => this.setState({ rascunho: e.target.value }),
          salvar: () => { const n = num(s.rascunho); this.setState(n > 0 ? { editando: null, ...setP({ ...pd, [p.id]: n }) } : { editando: null }); },
          ariaAtivo: (ativo ? 'Tirar ' : 'Colocar ') + p.nome + (ativo ? ' do' : ' no') + ' cardápio deste dia',
          alternar: () => { const n = { ...pd }; if (ativo) delete n[p.id]; else n[p.id] = p.padrao; this.setState({ editando: null, ...setP(n) }); },
          trilho: 'position: relative; display: block; width: 40px; height: 24px; border-radius: 99px; background: ' + (ativo ? 'var(--accent-fill)' : 'var(--line-2)'),
          bolinha: 'position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 99px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.2); left: ' + (ativo ? '19px' : '3px'),
          cardStyle: 'padding: 14px; display: flex; flex-direction: column; gap: 12px; ' + (ativo ? '' : 'opacity: .65')
        };
      })
    };
  }
}
</script>
</body>
</html>
