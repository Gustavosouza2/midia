<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vendas (celular) · Cantina da Mídia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2F2F3}
a{color:inherit}
button{cursor:pointer;font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #00716A;outline-offset:2px}
input::placeholder{color:#6B6B74}
.m{--page:#F2F2F3;--bg:#FFFFFF;--sub:#FAFAFA;--hover:#F4F4F5;--line:#ECECEE;--line-2:#E2E2E5;--text:#111113;--text-2:#3F3F46;--muted:#6B6B74;--primary:#111113;--on-primary:#FFFFFF;--accent:#00716A;--accent-fill:#359E95;--accent-soft:#E6F4F2;--warn:#B4400E;--warn-soft:#FFF1E8;--shadow:0 1px 2px rgba(17,17,19,.06),0 8px 24px rgba(17,17,19,.08)}
.m{position:relative;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;background:var(--page);color:var(--text);font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.m-head{display:flex;flex-direction:column;gap:12px;padding:16px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.m-body{flex:1;overflow-y:auto;padding:16px 16px 88px;display:flex;flex-direction:column;gap:14px}
.m-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding:6px 6px 14px;position:relative;z-index:2}
.m-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-decoration:none;color:var(--muted);font-size:10px}
.m-tab .ico{width:44px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.m-tab[aria-current="page"]{color:var(--text);font-weight:600}
.m-tab[aria-current="page"] .ico{background:var(--primary);color:var(--on-primary)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;box-sizing:border-box;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;flex:none}
.m-body>*,.m-head>*{flex-shrink:0}
.h2{margin:0;font-size:14px;font-weight:600}
.sub{font-size:11px;color:var(--muted)}
.field{height:42px;box-sizing:border-box;border:1px solid var(--line-2);border-radius:10px;background:var(--sub);display:flex;align-items:center;padding:0 12px;gap:8px}
.field input,.field select{border:0;background:transparent;font:inherit;font-size:14px;color:var(--text);min-width:0;width:100%;height:100%}
.lbl{font-size:11px;color:var(--muted)}
.fab{position:absolute;right:16px;bottom:92px;z-index:3;height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 8px 24px rgba(17,17,19,.25)}
.scrim{position:absolute;inset:0;z-index:5;background:rgba(17,17,19,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-radius:18px 18px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 32px rgba(17,17,19,.18)}
.seg{display:flex;padding:3px;gap:3px;border:1px solid var(--line-2);border-radius:10px;background:var(--sub)}
</style>
</helmet>
<div class="m">

  <header class="m-head">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; line-height: 1.25">
        <strong style="font-size: 18px; font-weight: 600">Vendas</strong>
        <span class="sub">{{diaLongo}}</span>
      </div>
      <span class="sub" style="text-align: right; white-space: pre-line">{{resumoTopo}}</span>
    </div>
    <div class="chips" role="tablist" aria-label="Dia de venda">
      <sc-for list="{{abas}}" as="a" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{a.on}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
      </sc-for>
    </div>
  </header>

  <div class="m-body">
    <div class="field" style="background: var(--bg)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar cliente</label>
      <input id="busca" type="search" placeholder="Buscar cliente" value="{{busca}}" onChange="{{buscar}}">
    </div>

    <section class="card" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <div style="padding: 12px; display: flex; flex-direction: column">
        <span class="sub">Recebido</span>
        <strong style="font-size: 15px; font-weight: 600; color: var(--accent)">{{totPago}}</strong>
      </div>
      <div style="padding: 12px; display: flex; flex-direction: column; border-left: 1px solid var(--line)">
        <span class="sub">Pendente</span>
        <strong style="font-size: 15px; font-weight: 600; color: var(--warn)">{{totPend}}</strong>
      </div>
      <div style="padding: 12px; display: flex; flex-direction: column; border-left: 1px solid var(--line)">
        <span class="sub">Reservas</span>
        <strong style="font-size: 15px; font-weight: 600">{{resQtd}}</strong>
      </div>
    </section>

    <div class="chips" role="group" aria-label="Status">
      <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{cartoes}}" as="p" hint-placeholder-count="4">
        <div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; gap: 10px">
            <div style="display: flex; flex-direction: column; line-height: 1.3; min-width: 0">
              <strong style="font-weight: 600">{{p.nome}}</strong>
              <span class="sub" style="color: var(--text-2)">{{p.item}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3">
              <strong style="font-weight: 600">{{p.valor}}</strong>
              <span class="sub">{{p.hora}}</span>
            </div>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 6px">
            <sc-if value="{{p.reserva}}" hint-placeholder-val="{{false}}">
              <span style="display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--sub); color: var(--text-2); font-size: 12px">Reservado</span>
              <button type="button" onClick="{{p.entregar}}" style="height: 30px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 12px">Entregar</button>
            </sc-if>
            <sc-if value="{{p.entregue}}" hint-placeholder-val="{{true}}">
              <span style="{{p.pillStyle}}">{{p.status}}</span>
              <button type="button" onClick="{{p.toggle}}" aria-label="{{p.aria}}" style="{{p.acaoStyle}}">{{p.acao}}</button>
            </sc-if>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{vazio}}" hint-placeholder-val="{{false}}">
        <div class="card" style="padding: 24px; text-align: center; font-size: 12px; color: var(--muted)">{{vazioTexto}}</div>
      </sc-if>
      <sc-if value="{{temMais}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{carregarMais}}" style="height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); color: var(--text-2); font-size: 12px">{{rotuloMais}}</button>
      </sc-if>
    </div>
  </div>

  <button type="button" class="fab" onClick="{{abrirForm}}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    Nova venda
  </button>

  <sc-if value="{{formAberto}}" hint-placeholder-val="{{false}}">
    <button type="button" class="scrim" aria-label="Fechar" onClick="{{fecharForm}}" style="border: 0; padding: 0"></button>
    <form class="sheet" aria-label="Nova venda ou reserva">
      <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 99px; background: var(--line-2)"></span>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <strong style="font-size: 16px; font-weight: 600">Novo pedido</strong>
        <button type="button" onClick="{{fecharForm}}" aria-label="Fechar" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--hover); color: var(--text-2); font-size: 16px">×</button>
      </div>
      <div class="seg" role="group" aria-label="Tipo">
        <sc-for list="{{tipos}}" as="t" hint-placeholder-count="2">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label class="lbl" for="m-nome">Quem</label>
        <div class="field"><input id="m-nome" type="text" placeholder="Nome da pessoa" value="{{nome}}" onChange="{{digitarNome}}"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label class="lbl" for="m-item">Item</label>
        <div class="field"><select id="m-item" value="{{produtoSel}}" onChange="{{escolherProduto}}">
          <sc-for list="{{opcoesProduto}}" as="o" hint-placeholder-count="2">
            <option value="{{o.id}}">{{o.nome}}</option>
          </sc-for>
        </select></div>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span class="lbl">Qtd</span>
          <div class="field" role="group" aria-label="Quantidade" style="padding: 0">
            <button type="button" aria-label="Diminuir" onClick="{{menos}}" style="width: 44px; height: 40px; border: 0; background: transparent; font-size: 18px; color: var(--text)">−</button>
            <output style="flex: 1; text-align: center; font-weight: 600; font-size: 15px">{{qtd}}</output>
            <button type="button" aria-label="Aumentar" onClick="{{mais}}" style="width: 44px; height: 40px; border: 0; background: transparent; font-size: 18px; color: var(--text)">+</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label class="lbl" for="m-preco">Preço un.</label>
          <div class="field"><span class="sub">R$</span><input id="m-preco" type="text" inputmode="decimal" value="{{precoForm}}" onChange="{{digitarPreco}}"></div>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Pagamento">
        <sc-for list="{{pagamentos}}" as="t" hint-placeholder-count="2">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <button type="button" onClick="{{registrar}}" style="height: 48px; border-radius: 12px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 14px; font-weight: 600">{{rotuloBotao}}</button>
    </form>
  </sc-if>

  <nav class="m-tabs" aria-label="Menu">
    <a class="m-tab" href="Mobile-Dashboard.dc.html">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg></span>
      Painel
    </a>
    <a class="m-tab" href="Mobile-Sales.dc.html" aria-current="page">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="17" cy="20" r="1"></circle></svg></span>
      Vendas
    </a>
    <a class="m-tab" href="Mobile-Pending.dc.html">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
      Pendentes
    </a>
    <a class="m-tab" href="Mobile-Menu.dc.html">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v20"></path><path d="M4 2v6a3 3 0 0 0 6 0V2"></path><path d="M17 2c-1.7 0-3 2-3 5s1.3 4 3 4v11"></path></svg></span>
      Cardápio
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      dia: '01nov', filtro: 'todas', busca: '', mostrar: 6,
      formAberto: false, tipo: 'venda', nome: '', produto: 'espeto', qtd: 1, precoTexto: null, pago: false, proximoId: 100,
      cardapio: { '15nov': { espeto: 12, refri: 6 }, '01nov': { espeto: 12, refri: 6 }, '18out': { espeto: 10 } },
      pedidos: [
        { id: 1, dia: '18out', nome: 'Charlene', produto: 'espeto', qtd: 5, preco: 10, hora: '18:45', reserva: false, pago: true },
        { id: 2, dia: '18out', nome: 'Mariana', produto: 'espeto', qtd: 1, preco: 10, hora: '18:45', reserva: false, pago: true },
        { id: 3, dia: '18out', nome: 'Paulinha', produto: 'espeto', qtd: 3, preco: 10, hora: '20:12', reserva: false, pago: true },
        { id: 4, dia: '18out', nome: 'Melina', produto: 'espeto', qtd: 3, preco: 10, hora: '20:13', reserva: false, pago: false },
        { id: 5, dia: '18out', nome: 'Elised', produto: 'espeto', qtd: 2, preco: 10, hora: '20:15', reserva: false, pago: true },
        { id: 6, dia: '18out', nome: 'Evelyn', produto: 'espeto', qtd: 1, preco: 10, hora: '20:15', reserva: false, pago: true },
        { id: 7, dia: '18out', nome: 'Tamires', produto: 'espeto', qtd: 1, preco: 10, hora: '20:15', reserva: false, pago: true },
        { id: 8, dia: '18out', nome: 'Renan e Tay', produto: 'espeto', qtd: 2, preco: 10, hora: '20:16', reserva: false, pago: true },
        { id: 9, dia: '18out', nome: 'Júnior', produto: 'espeto', qtd: 1, preco: 10, hora: '20:17', reserva: false, pago: true },
        { id: 10, dia: '18out', nome: 'Aniello', produto: 'espeto', qtd: 1, preco: 10, hora: '20:18', reserva: false, pago: false },
        { id: 11, dia: '18out', nome: 'José', produto: 'espeto', qtd: 1, preco: 10, hora: '20:19', reserva: false, pago: true },
        { id: 12, dia: '18out', nome: 'Maju', produto: 'espeto', qtd: 1, preco: 10, hora: '20:19', reserva: false, pago: false },
        { id: 13, dia: '01nov', nome: 'Elizete', produto: 'espeto', qtd: 2, preco: 12, hora: '20:56', reserva: false, pago: false },
        { id: 14, dia: '01nov', nome: 'Fernando', produto: 'espeto', qtd: 2, preco: 12, hora: '20:57', reserva: false, pago: false },
        { id: 15, dia: '01nov', nome: 'Angélica', produto: 'espeto', qtd: 1, preco: 12, hora: '20:58', reserva: false, pago: false },
        { id: 16, dia: '01nov', nome: 'Lorrayne', produto: 'espeto', qtd: 1, preco: 12, hora: '20:58', reserva: false, pago: false },
        { id: 17, dia: '15nov', nome: 'Gustavo', produto: 'espeto', qtd: 3, preco: 12, hora: 'reservou 08 nov', reserva: true, pago: false }
      ]
    };
  }
  renderVals() {
    const DIAS = { '15nov': ['15 nov · próximo', 'Domingo, 15 de novembro'], '01nov': ['01 nov', 'Domingo, 1 de novembro'], '18out': ['18 out', 'Domingo, 18 de outubro'] };
    const PRODUTOS = { espeto: 'Espeto de carne', refri: 'Refrigerante lata' };
    const num = (t) => { const n = Number(String(t).replace(',', '.').replace(/[^0-9.]/g, '')); return Number.isFinite(n) ? n : 0; };
    const brl = (n) => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
    const s = this.state;
    const menu = s.cardapio[s.dia] || {};
    const ids = Object.keys(menu);
    const produtoSel = ids.includes(s.produto) ? s.produto : ids[0];
    const precoForm = s.precoTexto !== null ? s.precoTexto : String(menu[produtoSel] || 0).replace('.', ',');
    const precoUn = num(precoForm);
    const doDia = s.pedidos.filter((p) => p.dia === s.dia);
    const entregues = doDia.filter((p) => !p.reserva);
    const valor = (p) => p.qtd * p.preco;
    const soma = (l) => l.reduce((a, p) => a + valor(p), 0);
    const termo = s.busca.trim().toLowerCase();
    const filtrados = doDia.filter((p) => !termo || p.nome.toLowerCase().includes(termo)).filter((p) => s.filtro === 'todas'
      || (s.filtro === 'reservas' && p.reserva) || (s.filtro === 'pendentes' && !p.reserva && !p.pago) || (s.filtro === 'pagas' && !p.reserva && p.pago));
    const chip = 'height: 32px; padding: 0 14px; border-radius: 99px; font-size: 12px; white-space: nowrap; flex: none; ';
    const chipOn = 'border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary)';
    const chipOff = 'border: 1px solid var(--line-2); background: var(--bg); color: var(--text-2)';
    const seg = 'flex: 1; height: 36px; border: 0; border-radius: 8px; font-size: 13px; ';
    const atualizar = (id, m) => () => this.setState({ pedidos: s.pedidos.map((p) => p.id === id ? { ...p, ...m } : p) });
    const agora = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
    const reserva = s.tipo === 'reserva';
    const visiveis = filtrados.slice(0, s.mostrar);
    return {
      diaLongo: DIAS[s.dia][1],
      resumoTopo: entregues.reduce((a, p) => a + p.qtd, 0) + ' itens\n' + brl(soma(entregues)),
      abas: Object.keys(DIAS).map((id) => ({ label: DIAS[id][0], on: s.dia === id, pick: () => this.setState({ dia: id, filtro: 'todas', mostrar: 6, precoTexto: null }), style: chip + (s.dia === id ? chipOn : chipOff) })),
      busca: s.busca,
      buscar: (e) => this.setState({ busca: e.target.value, mostrar: 6 }),
      totPago: brl(soma(entregues.filter((p) => p.pago))),
      totPend: brl(soma(entregues.filter((p) => !p.pago))),
      resQtd: doDia.filter((p) => p.reserva).length,
      filtros: [['todas', 'Todos'], ['reservas', 'Reservas'], ['pendentes', 'Pendentes'], ['pagas', 'Pagos']].map(([id, label]) => ({ label, on: s.filtro === id, pick: () => this.setState({ filtro: id, mostrar: 6 }), style: chip + (s.filtro === id ? chipOn : chipOff) })),
      cartoes: visiveis.map((p) => ({
        nome: p.nome,
        item: p.qtd + '× ' + PRODUTOS[p.produto] + ' · ' + brl(p.preco),
        valor: brl(valor(p)),
        hora: p.hora,
        reserva: p.reserva,
        entregue: !p.reserva,
        entregar: atualizar(p.id, { reserva: false, hora: agora() }),
        status: p.pago ? 'Pago' : 'Pendente',
        acao: p.pago ? 'Desfazer' : 'Marcar pago',
        acaoStyle: 'height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12px; ' + (p.pago ? 'border: 1px solid var(--line-2); background: var(--bg); color: var(--text-2)' : 'border: 0; background: var(--primary); color: var(--on-primary)'),
        aria: p.pago ? 'Voltar ' + p.nome + ' para pendente' : 'Marcar ' + p.nome + ' como pago',
        pillStyle: 'display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12px; ' + (p.pago ? 'background: var(--accent-soft); color: var(--accent)' : 'background: var(--warn-soft); color: var(--warn)'),
        toggle: atualizar(p.id, { pago: !p.pago })
      })),
      vazio: filtrados.length === 0,
      vazioTexto: termo ? 'Ninguém com esse nome neste dia.' : 'Nenhum pedido aqui ainda.',
      temMais: filtrados.length > s.mostrar,
      rotuloMais: 'Carregar mais (' + (filtrados.length - s.mostrar) + ')',
      carregarMais: () => this.setState({ mostrar: s.mostrar + 6 }),
      formAberto: s.formAberto,
      abrirForm: () => this.setState({ formAberto: true }),
      fecharForm: () => this.setState({ formAberto: false }),
      tipos: [['venda', 'Venda'], ['reserva', 'Reserva']].map(([id, label]) => ({ label, on: s.tipo === id, pick: () => this.setState({ tipo: id }), style: seg + (s.tipo === id ? 'background: var(--primary); color: var(--on-primary)' : 'background: transparent; color: var(--muted)') })),
      nome: s.nome,
      digitarNome: (e) => this.setState({ nome: e.target.value }),
      produtoSel,
      opcoesProduto: ids.map((id) => ({ id, nome: PRODUTOS[id] + ' · ' + brl(menu[id]) })),
      escolherProduto: (e) => this.setState({ produto: e.target.value, precoTexto: null }),
      qtd: s.qtd,
      menos: () => this.setState({ qtd: Math.max(1, s.qtd - 1) }),
      mais: () => this.setState({ qtd: Math.min(99, s.qtd + 1) }),
      precoForm,
      digitarPreco: (e) => this.setState({ precoTexto: e.target.value }),
      pagamentos: [[true, 'Pago'], [false, 'Pendente']].map(([v, label]) => ({ label, on: s.pago === v, pick: () => this.setState({ pago: v }), style: seg + (s.pago === v ? 'background: var(--primary); color: var(--on-primary)' : 'background: transparent; color: var(--muted)') })),
      rotuloBotao: (reserva ? 'Reservar · ' : 'Registrar venda · ') + brl(s.qtd * precoUn),
      registrar: () => {
        const nome = s.nome.trim();
        if (!nome || precoUn <= 0) return;
        const novo = { id: s.proximoId, dia: s.dia, nome, produto: produtoSel, qtd: s.qtd, preco: precoUn, hora: reserva ? 'reservou agora' : agora(), reserva, pago: s.pago };
        this.setState({ pedidos: [novo].concat(s.pedidos), proximoId: s.proximoId + 1, nome: '', qtd: 1, precoTexto: null, formAberto: false });
      }
    };
  }
}
</script>
</body>
</html>
